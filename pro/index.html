  const storageKey = 'lobe-trainer-pro-key-v1';
  const form = document.getElementById('unlockForm');
  const password = document.getElementById('password');
  const remember = document.getElementById('remember');
  const button = document.getElementById('unlockButton');
  const error = document.getElementById('error');
  const status = document.getElementById('status');
  const decode = value => Uint8Array.from(atob(value), char => char.charCodeAt(0));
  const encode = value => btoa(String.fromCharCode(...new Uint8Array(value)));
  function forget() { try { localStorage.removeItem(storageKey); } catch {} }
  function showForm() { form.hidden = false; status.hidden = true; }
  async function decrypt(key) {
    const bytes = await crypto.subtle.decrypt({name: 'AES-GCM', iv: decode(payload.iv)}, key, decode(payload.ciphertext));
    return new TextDecoder('utf-8', {fatal: true}).decode(bytes);
  }
  async function openApp(html) {
    if (document.readyState !== 'complete') {
      await new Promise(resolve => window.addEventListener('load', resolve, {once: true}));
    }
    await new Promise(resolve => setTimeout(resolve, 0));
    document.open(); document.write(html); document.close();
  }

    const saved = localStorage.getItem(storageKey);

      const key = await crypto.subtle.importKey('raw', decode(entry.key), 'AES-GCM', false, ['decrypt']);

      await openApp(html);
